name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q .

      - name: Run deterministic synthetic end-to-end smoke test
        run: |
          python main.py \
            --synthetic \
            --seed 42 \
            --n-normal 60 \
            --n-clusters 2 \
            --n-days 2 \
            --top-n 10 \
            --save-synthetic output/smoke/input.jsonl \
            --output-dir output/smoke

      - name: Verify result artifacts and run metadata
        run: |
          test -s output/smoke/input.jsonl
          test -s output/smoke/ranked_nodes.json
          test -s output/smoke/cluster_summary.json
          test -s output/smoke/full_results.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('output/smoke/full_results.json').read_text())
          cfg = result['run_meta']['config']
          assert cfg['seed'] == 42
          assert cfg['flag_threshold'] == 0.55
          assert result['run_meta']['source'] == 'synthetic'
          PY
