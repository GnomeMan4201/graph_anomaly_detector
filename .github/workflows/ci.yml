name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile source
        run: |
          python -m compileall -q .

      - name: Run synthetic end-to-end smoke test
        run: |
          python main.py \
            --synthetic \
            --n-normal 60 \
            --n-clusters 2 \
            --n-days 2 \
            --top-n 10 \
            --output-dir output/smoke

      - name: Verify result artifacts
        run: |
          test -s output/smoke/ranked_nodes.json
          test -s output/smoke/cluster_summary.json
          test -s output/smoke/full_results.json
